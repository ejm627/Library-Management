<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Admin Login</h1>
</header>

<div class="container">

    <div class="card">

        <form id="adminLoginForm">

            <label>Username</label>
            <input
                type="text"
                id="adminUsername">

            <label>Password</label>
            <input
                type="password"
                id="adminPassword">

            <button
                type="submit"
                class="btn">
                Login
            </button>

        </form>

    </div>

</div>

</body>
</html>
