<!DOCTYPE html>
<html>
<head>
    <title>User Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>User Login</h1>
</header>

<div class="container">

    <div class="card">

        <form id="userLoginForm">

            <label>Username</label>
            <input
                type="text"
                id="username"
                placeholder="Enter Username">

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter Password">

            <button
                class="btn"
                type="submit">
                Login
            </button>

        </form>

        <br>

        <a href="admin-login.html">
            Admin Login
        </a>

    </div>

</div>

</body>
</html>
