<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>User Dashboard</h1>
</header>

<div class="container">

    <div class="card">

        <h2>Currently Checked Out</h2>

        <table>
            <thead>
                <tr>
                    <th>Book</th>
                    <th>Due Date</th>
                </tr>
            </thead>

            <tbody id="checkedOutBooks">
                <!-- JS inserts books -->
            </tbody>

        </table>

    </div>

    <div class="card">

        <h2>Overdue Books</h2>

        <table>
            <thead>
                <tr>
                    <th>Book</th>
                    <th>Due Date</th>
                    <th>Days Late</th>
                </tr>
            </thead>

            <tbody id="overdueBooks">
                <!-- JS inserts overdue books -->
            </tbody>

        </table>

    </div>

</div>

</body>
</html>
