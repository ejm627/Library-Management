<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Campus Library Management System">
    <title>User Login | Student Library</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="site-title" href="../index.html">Student Library</a>
            <nav class="site-nav" aria-label="Main navigation">
                <a href="../index.html">Home</a>
                <a href="login.html" aria-current="page">User Login</a>
                <a href="admin-login.html">Admin Login</a>
                <a href="dashboard.html">User Dashboard</a>
                <a href="admin-dashboard.html">Admin Dashboard</a>
            </nav>
        </div>
    </header>

    <main>

        <section class="form-panel">
            <h2>User Login</h2>
            <p class="muted">Enter your library account information.</p>
            <form action="#" method="get">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username"
                           placeholder="Enter your username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password"
                           placeholder="Enter your password" autocomplete="current-password">
                </div>

                <div class="form-actions">
                    <button type="button">Login</button>
                </div>
            </form>

            <p class="form-note">Administrator? <a href="admin-login.html">Go to Admin Login</a></p>
            <p class="form-note"><a href="../index.html">Return to Home</a></p>
            <div class="notice">NOTICE: not hooked up yet.</div>
        </section>

    </main>

    <footer class="site-footer">
        <p>Library Management System | CS 212 Project</p>
    </footer>
</body>
</html>
